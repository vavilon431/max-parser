# Drop-in конфіг для systemd-journald — обмежує розмір журналу.
# Шлях деплою на VPS: /etc/systemd/journald.conf.d/max-parser.conf
# Активація:
#   systemctl restart systemd-journald
#
# Параметри:
# - SystemMaxUse: загальний розмір журналу не перевищить 500 МБ
# - SystemKeepFree: завжди залишати 1 ГБ вільного місця на диску
# - MaxFileSec: один файл журналу — не довше 7 днів (потім ротація)
# - MaxRetentionSec: видаляти записи старші 30 днів
# - Compress: стискати старі сегменти

[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxFileSec=7day
MaxRetentionSec=30day
Compress=yes
ForwardToSyslog=no
